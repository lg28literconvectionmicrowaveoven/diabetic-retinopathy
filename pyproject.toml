[project]
name = "diabetic-retinopathy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sabarigirish Manikandan", email = "sabari.girish2057@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "huggingface-hub>=1.30.0",
    "joblib>=1.3",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "timm>=1.0",
    "tqdm>=4.70.0",
    "transformers>=5.16.1",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
diabetic-retinopathy = "diabetic_retinopathy:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
