#All dataset paths are relative to DATA_ROOT .
data:
  #root contains:
  #messidor2/
  #idrid/
  data_root: "data"

  #training dataset from the supplied benchmark notebook, for now aptos
  aptos:
    root: "aptos2019-blindness-detection"
    images: "train_images"
    csv: "train.csv"
    image_id_column: "id_code"
    label_column: "diagnosis"

  # messidor for external
  messidor2:
    root: "messidor2"
    images: "IMAGES/cropped_448x448"
    csv: "messidor_data.csv"
    image_id_column: "image_id"
    label_column: "adjudicated_dr_grade"
    gradable_column: "adjudicated_gradable"

  #external dataset for idrid
  idrid:
    enabled: true
    root: "idrid"
    images: "extracted/B. Disease Grading/1. Original Images/b. Testing Set"
    csv: "labels.csv"
    image_id_column: "image_id"
    label_column: "grade"

experiment:
  train_dataset: "messidor2"
  external_test_dataset: "idrid"

  num_classes: 5
  referable_threshold: 2   #grade >= 2 => referable DR

  #Grouped five-fold CV: 80% development per fold (85/15 train/val)
  #-> ~68/12/20 effective train/val/internal-test sizes.
  n_folds: 5
  fold_seed: 42
  dev_val_size: 0.15

#Patient pairing: both eyes of one patient must share a CV fold.
#Validate the rule on the real CSV first: python tests/validate_messidor_pairs.py
grouping:
  mode: column
  column: "patient_id"

model:
  name: "google/medsiglip-448"
  expected_embedding_dim: 1152
  cache_embeddings: true
  embedding_batch_size: 32
  device: "auto"            #auto | cuda | cpu

head:
  type: "mlp"
  hidden_dim: 512
  dropout: 0.10
  batch_size: 64
  max_epochs: 30
  patience: 5
  learning_rate: 0.001
  weight_decay: 0.01

evaluation:
  ece_bins: 10
  save_predictions: true
  save_confusion_matrix: true

preprocessing:
  enabled: true
  grayscale: true
  grayscale_mode: "green"   # green (highest DR lesion contrast) | luminance
  illumination_correction: true
  clahe: true
  normalization: true
  clahe_clip_limit: 2.0
  clahe_grid_size: [8, 8]
  gaussian_sigma: 30.0
  p_min: 1.0
  p_max: 99.0
  mask_background: true
  mask_threshold: 10

output:
  root: "outputs"
  checkpoint_dir: "outputs/checkpoints"
  embedding_dir: "outputs/embeddings"
  prediction_dir: "outputs/predictions"
  metric_dir: "outputs/metrics"
  log_dir: "outputs/logs"
